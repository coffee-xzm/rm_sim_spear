[SystemSettings]
; SPEAR's USpSceneCaptureComponent2D writes UserSceneTexture outputs that the
; post-process graph never consumes, so the engine default (=2, "enable on
; error") would draw a debug overlay into captured scene color. Unlike most
; overlays this one is not gated by any EngineShowFlags, so config is the only
; lever. It has to live here and NOT be written through console_service.set_cvar
; at runtime: MaterialEditor is loaded in `UnrealEditor -game` and broadcasts a
; post-process preview refresh on this cvar, which SIGSEGVs when the editor
; subsystem collection is absent (observed 2026-10-06 as a Signal 11 right
; after the first bound frame).
r.PostProcessing.UserSceneTextureDebug=0

;
; Renderer budget switches, measured on 2026-10-06 (RTX 4060 Laptop, 8188 MiB heap,
; 6358-6736 MiB driver budget).  The numbers are UE-footprint deltas
; (peak_used - desktop baseline) at 1440x1080 single capture; the run-to-run
; floor is about +-200 MiB.  Full data and the measurement protocol:
; docs/render_budget.md.
;
; GI and reflections are deliberately NOT reduced here: they stay Lumen
; (DynamicGlobalIlluminationMethod=1, ReflectionMethod=1 in
; [/Script/Engine.RendererSettings]).  Everything below was chosen to be
; visually free or nearly free.
;

; Hardware ray tracing builds BLAS/TLAS for the whole merged CAD map.  Keep the
; feature enabled (r.RayTracing=True in RendererSettings) but do not build by
; default; turn it on per run when a path needs it.  Measured: -551 MiB, frame
; time unchanged.
r.RayTracing.Enable=0
r.RayTracing.EnableOnDemand=1

; Virtual shadow map page pool: 4096 pages by default.  1024 keeps the look while
; removing the pre-allocated peak.  Measured: -427 MiB, frame time unchanged.
; (Fully disabling VSM instead saves -543 MiB but costs +53 ms/frame, because
; shadows fall back to CSM; prefer the page cap.)
r.Shadow.Virtual.MaxPhysicalPages=1024

; Lumen surface cache atlas: 4096 by default.  Measured: -295 MiB at 1024.
r.LumenScene.SurfaceCache.AtlasSize=1024

; Virtualized geometry: this scene's meshes are not Nanite, so the pools are pure
; overhead.  Measured: -669..-834 MiB with a pixel-identical frame (mean|delta|
; 0.04 over 4 same-session A/B runs).  Re-enable (r.Nanite=1) if Nanite meshes
; are ever imported.
r.Nanite=0

; Keep mesh distance fields (they are only -10 MiB to drop) but stop tracing them
; for Lumen: software GI falls back to the cheaper path, as in upstream SpearSim.
r.Lumen.TraceMeshSDFs=0

;
; Further switches, deliberately left OFF.  Uncomment one at a time and re-measure
; (docs/render_budget.md section 6) instead of stacking them blindly.
;
; -1008 MiB, -14 ms/frame, but dynamic shadows disappear:
;r.ShadowQuality=0
;
; -543 MiB, +53 ms/frame (CSM fallback), not worth it:
;r.Shadow.Virtual.Enable=0
;
; -684 MiB, largest visual change (scene reads as unlit CAD):
;r.DynamicGlobalIlluminationMethod=0
;r.ReflectionMethod=0
;
; -574 MiB, harsher than the 1024-page cap above:
;r.Shadow.Virtual.MaxPhysicalPages=512
;
[Core.System]
ZeroEngineVersionWarning=False

;
; Shader compile worker budget (2026-10-06).  The engine default is
; NumUnusedShaderCompilingThreads=3 (Engine/Config/BaseEngine.ini:2181), i.e. 29
; workers on this 32-thread machine, each ~0.5 GB resident.  During the first
; full SM6 cook that, plus a ~6 GB cooker and the desktop, pushed the machine to
; ~25 GB of 32 GB and the kernel killed the ZenServer -- which does NOT stop the
; cook: it keeps retrying oplog commits and looks alive for hours while making no
; progress (both this project and ~/rm_sim_rune hit it).  12 unused threads costs
; some cook throughput and buys ~4 GB of headroom.
;
[DevOptions.Shaders]
NumUnusedShaderCompilingThreads=12

