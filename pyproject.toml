[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rm-sim-spear"
version = "0.1.0"
description = "Frame-consistent RoboMaster simulation core"
requires-python = ">=3.11"
dependencies = ["mujoco>=3.1,<4"]

[project.scripts]
rm-sim-spear = "rm_sim_spear.cli:main"

[tool.setuptools.packages.find]
include = ["rm_sim_spear*", "bridge*", "pipeline*"]
